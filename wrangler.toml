name = "yt-adv-search"
main = "worker.js"
compatibility_date = "2025-06-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

# Local dev: `npx wrangler dev` reads `.dev.vars` (and `.env` in recent
# wrangler). Copy `.env.example` to `.dev.vars` for local runs:
#   YOUTUBE_API_KEYS=k1,k2
# Prod: `wrangler secret put YOUTUBE_API_KEYS`
#
# Static pages live in ./public (index.html + styles.css now; tools.html and
# settings.html land in T-0003/T-0004). The worker delegates known static
# routes to the ASSETS binding and keeps placeholder fallbacks.
